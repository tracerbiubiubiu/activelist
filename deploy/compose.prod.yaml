# activelist 部署态 compose（M-A6 部署件；开发态 = deploy/compose.dev.yaml 仅 PG）。
#
# 拓扑（ADR-003 D5 双 network）：apiserver 跨双网——activelist_internal（仅 PG 可达）
# 与 zhuzhao_to_activelist（external，由部署侧预建：docker network create zhuzhao_to_activelist，
# zhuzhao 网关容器须加入同一网络）；PG 仅内网。apiserver 无状态，deploy.replicas=2 多副本
#（迁移自带会话级 advisory lock，并发启动安全——A7）。
#
# 环境变量（.env 或 export）——两项均必填，缺失 compose 直接报错拒建（fail-closed）：
#   ACTIVELIST_CALLER_ZHUZHAO_SK  zhuzhao 网关出站签名 SK（与网关侧 GATEWAY_SK 同值）；
#                                 应用层对空 SK 亦 fail-closed 拒启——不给弱缺省值，
#                                 防止生产忘配 env 时以公开弱密钥启动、验签形同虚设
#   ACTIVELIST_PG_PASSWORD        PG 口令
#
# 备份策略：每日 02:00 pg_dump（pgbackup 服务，保留 14 份）+ WAL 归档（archive_timeout
# 5 分钟）；恢复步骤见 deploy/backup/README.md。
name: activelist

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: activelist
      POSTGRES_PASSWORD: ${ACTIVELIST_PG_PASSWORD:?需注入 ACTIVELIST_PG_PASSWORD}
      POSTGRES_DB: activelist
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - archive_mode=on
      # 覆盖语义（2026-09-15 复查修正）：崩溃残留的半截同名段会被重归档完整重写；
      # 原 test ! -f 守卫会把残留当「已归档」永久跳过——PITR 时该段静默损坏
      - -c
      - archive_command=cp %p /wal_archive/%f
      - -c
      - archive_timeout=300s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    networks:
      - activelist_internal
    # 2026-09-14 备份事故修复：postgres 原为默认 no，停机后不自启 → pgbackup 每日
    # 02:00 pg_dump 连续三日 DNS 解析失败（postgres 不可达）。与其他服务口径对齐。
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activelist -d activelist"]
      interval: 5s
      timeout: 3s
      retries: 10

  apiserver:
    build: ..
    image: activelist-apiserver:latest
    environment:
      ACTIVELIST_CALLER_ZHUZHAO_SK: ${ACTIVELIST_CALLER_ZHUZHAO_SK:?需注入 ACTIVELIST_CALLER_ZHUZHAO_SK（与 zhuzhao 网关侧 GATEWAY_SK 同值）}
      ACTIVELIST_PG_HOST: postgres
      ACTIVELIST_PG_PORT: "5432"
      ACTIVELIST_PG_PASSWORD: ${ACTIVELIST_PG_PASSWORD:?需注入 ACTIVELIST_PG_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      activelist_internal: {}
      zhuzhao_to_activelist:
        aliases:
          - activelist # 供 zhuzhao 网关以 http://activelist:8080 稳定寻址（多副本缩扩容不变）
    deploy:
      replicas: 2 # 无状态多副本；扩缩 = docker compose up -d --scale apiserver=N
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgbackup:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGUSER: activelist
      PGPASSWORD: ${ACTIVELIST_PG_PASSWORD}
      PGDATABASE: activelist
      BACKUP_DIR: /backups
      RETAIN_COUNT: "14"
    volumes:
      - backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - wal_archive:/wal_archive:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - activelist_internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  activelist_internal: {}
  zhuzhao_to_activelist:
    external: true

volumes:
  pgdata:
  wal_archive:
  backups:
