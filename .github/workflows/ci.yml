name: ci
on:
  push:
    branches: ["**"]
  pull_request:

# 连续 push 只跑最新提交（过期 run 自动取消，省 runner 时长）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit policy negative checks
        run: make test-commit-lint
      - name: Exact push or PR commit window
        run: python3 scripts/commit-policy.py ci --fetch-missing
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # testcontainers 挂起时兜底（默认 6h）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: unit (race)
        run: go test -race ./...
      - name: integration (testcontainers, race)
        run: go test -tags integration -race ./...
